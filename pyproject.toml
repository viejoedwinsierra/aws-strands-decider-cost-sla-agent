[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-cost-sla-decision-agent"
version = "0.1.0"
description = "Evidence-driven AWS infrastructure decisions using Strands Decider 2B"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Edwin Sierra" }
]
dependencies = ["PyYAML>=6,<7"]

[project.optional-dependencies]
decider = [
    "strands-decider==0.1.0",
    "transformers==5.20.1",
    "accelerate==1.15.0"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true

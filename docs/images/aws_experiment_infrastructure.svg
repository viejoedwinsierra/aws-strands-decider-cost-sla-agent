<text x="62" y="974" font-family="Arial,Helvetica,sans-serif" font-size="18" fill="#294764" font-weight="normal" text-anchor="start">20 historical RUN_IDs (10 EXP-001 + 10 EXP-002) × 2 providers = 40 model inferences.</text>
<text x="62" y="1003" font-family="Arial,Helvetica,sans-serif" font-size="17" fill="#294764" font-weight="normal" text-anchor="start">EXP-002: SLA NOT_EVALUATED → policy can return Insufficient Evidence regardless of model proposal.</text>
<text x="62" y="1031" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#64788B" font-weight="normal" text-anchor="start">Advisory only: no autonomous scaling; no measured dollar savings; historical AWS infrastructure is decommissioned.</text>
